name: Release

# Build rclone for Linux, Windows and macOS, then attach the archives to a
# GitHub Release. Triggered by pushing a v* tag, or manually with a tag name.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release, e.g. v1.71.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.0"
  BINARY_NAME: rclone
  # Tag being released: the workflow_dispatch input, otherwise the pushed tag.
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  CGO_ENABLED: "0"

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Build the tag itself, including on manual dispatch where the
          # default ref would be the branch the workflow was started from.
          ref: ${{ env.TAG }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail

          suffix=""
          if [ "${GOOS}" = "windows" ]; then suffix=".exe"; fi

          # Embed the release tag so `rclone version` reports it.
          ldflags="-s -w -X github.com/rclone/rclone/fs.Version=${TAG}"

          go build -trimpath -buildvcs=false \
            -ldflags "${ldflags}" \
            -o "dist/${BINARY_NAME}${suffix}" .

          (cd dist && zip -q -9 "${BINARY_NAME}-${TAG}-${GOOS}-${GOARCH}.zip" "${BINARY_NAME}${suffix}")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ env.BINARY_NAME }}-${{ env.TAG }}-${{ matrix.goos }}-${{ matrix.goarch }}.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          ls -l
          sha256sum ./*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(env.TAG, '-') }}
          fail_on_unmatched_files: true
